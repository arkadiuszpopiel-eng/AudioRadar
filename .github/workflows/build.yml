# RadarSuite V4.2 - CI/CD Build Workflow
# Automatic builds for Windows and Linux platforms
# Created: 2025-12-04

name: Build RadarSuite V4.2

on:
  push:
    branches:
      - main
      - master
      - 'claude/*'
    paths:
      - 'RadarSuite_Windows_V4.2/**'
      - 'RadarSuite_Linux_V4.2/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'RadarSuite_Windows_V4.2/**'
      - 'RadarSuite_Linux_V4.2/**'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows version'
        required: false
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux version'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # Windows Build
  # ============================================================================
  build-windows:
    name: Build Windows V4.2
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'RadarSuite_Windows_V4.2/requirements.txt'

      - name: Install dependencies
        working-directory: RadarSuite_Windows_V4.2
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python packages
        working-directory: RadarSuite_Windows_V4.2
        run: |
          python -c "import PyQt5; print(f'PyQt5 OK')"
          python -c "import numpy; print(f'NumPy {numpy.__version__}')"
          python -c "import pyaudiowpatch; print('pyaudiowpatch OK')"

      - name: Build with PyInstaller
        working-directory: RadarSuite_Windows_V4.2
        run: |
          pyinstaller build_tools/radarsuite.spec --noconfirm --clean

      - name: Verify build output
        working-directory: RadarSuite_Windows_V4.2
        run: |
          if (Test-Path "dist/RadarSuite_Windows/RadarSuite_Windows.exe") {
            Write-Host "Build successful: RadarSuite_Windows.exe exists"
            $fileInfo = Get-Item "dist/RadarSuite_Windows/RadarSuite_Windows.exe"
            Write-Host "Size: $($fileInfo.Length / 1MB) MB"
          } else {
            Write-Error "Build failed: RadarSuite_Windows.exe not found"
            exit 1
          }

      - name: Create ZIP archive
        working-directory: RadarSuite_Windows_V4.2
        run: |
          Compress-Archive -Path "dist/RadarSuite_Windows/*" -DestinationPath "RadarSuite_Windows_V4.2.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadarSuite_Windows_V4.2
          path: RadarSuite_Windows_V4.2/RadarSuite_Windows_V4.2.zip
          retention-days: 30

  # ============================================================================
  # Linux Build
  # ============================================================================
  build-linux:
    name: Build Linux V4.2
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpulse0 \
            portaudio19-dev \
            libxcb-xinerama0 \
            libxcb-image0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxkbcommon-x11-0 \
            libxcb-render-util0 \
            libxcb-xkb1 \
            libxcb-shape0 \
            libopengl0 \
            libgl1-mesa-glx \
            libegl1-mesa \
            pipewire-utils \
            pulseaudio-utils

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'RadarSuite_Linux_V4.2/requirements-linux.txt'

      - name: Install Python dependencies
        working-directory: RadarSuite_Linux_V4.2
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt

      - name: Verify Python packages
        working-directory: RadarSuite_Linux_V4.2
        run: |
          python -c "import PyQt5; print('PyQt5 OK')"
          python -c "import numpy; print(f'NumPy {numpy.__version__}')"
          python -c "import soundcard; print('soundcard OK')"
          python -c "import sounddevice; print('sounddevice OK')"

      - name: Build with PyInstaller
        working-directory: RadarSuite_Linux_V4.2
        run: |
          pyinstaller build_tools/radarsuite_linux.spec --noconfirm --clean

      - name: Verify build output
        working-directory: RadarSuite_Linux_V4.2
        run: |
          if [ -f "dist/RadarSuite_Linux/RadarSuite_Linux" ]; then
            echo "Build successful: RadarSuite_Linux exists"
            ls -lh "dist/RadarSuite_Linux/RadarSuite_Linux"
          else
            echo "Build failed: RadarSuite_Linux not found"
            exit 1
          fi

      - name: Create TAR.GZ archive
        working-directory: RadarSuite_Linux_V4.2
        run: |
          cd dist
          tar -czvf ../RadarSuite_Linux_V4.2.tar.gz RadarSuite_Linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadarSuite_Linux_V4.2
          path: RadarSuite_Linux_V4.2/RadarSuite_Linux_V4.2.tar.gz
          retention-days: 30

  # ============================================================================
  # Build Summary
  # ============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-windows.result }}" == "success" ]; then
            echo "| Windows V4.2 | :white_check_mark: Success |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-windows.result }}" == "skipped" ]; then
            echo "| Windows V4.2 | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Windows V4.2 | :x: Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.build-linux.result }}" == "success" ]; then
            echo "| Linux V4.2 | :white_check_mark: Success |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-linux.result }}" == "skipped" ]; then
            echo "| Linux V4.2 | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Linux V4.2 | :x: Failed |" >> $GITHUB_STEP_SUMMARY
          fi

# RadarSuite V4.2 - Release Workflow
# Creates GitHub releases with built artifacts when tags are pushed
# Created: 2025-12-04

name: Release RadarSuite V4.2

on:
  push:
    tags:
      - 'v*.*.*'
      - 'V*.*.*'

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # Build Windows for Release
  # ============================================================================
  build-windows-release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'RadarSuite_Windows_V4.2/requirements.txt'

      - name: Install dependencies
        working-directory: RadarSuite_Windows_V4.2
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        working-directory: RadarSuite_Windows_V4.2
        run: |
          pyinstaller build_tools/radarsuite.spec --noconfirm --clean

      - name: Create ZIP archive
        working-directory: RadarSuite_Windows_V4.2
        run: |
          Compress-Archive -Path "dist/RadarSuite_Windows/*" -DestinationPath "RadarSuite_Windows_${{ github.ref_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: RadarSuite_Windows_V4.2/RadarSuite_Windows_${{ github.ref_name }}.zip

  # ============================================================================
  # Build Linux for Release
  # ============================================================================
  build-linux-release:
    name: Build Linux Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpulse0 \
            portaudio19-dev \
            libxcb-xinerama0 \
            libxcb-image0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxkbcommon-x11-0 \
            libxcb-render-util0 \
            libxcb-xkb1 \
            libxcb-shape0 \
            libopengl0 \
            libgl1-mesa-glx \
            libegl1-mesa \
            pipewire-utils \
            pulseaudio-utils

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'RadarSuite_Linux_V4.2/requirements-linux.txt'

      - name: Install Python dependencies
        working-directory: RadarSuite_Linux_V4.2
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt

      - name: Build with PyInstaller
        working-directory: RadarSuite_Linux_V4.2
        run: |
          pyinstaller build_tools/radarsuite_linux.spec --noconfirm --clean

      - name: Create TAR.GZ archive
        working-directory: RadarSuite_Linux_V4.2
        run: |
          cd dist
          tar -czvf ../RadarSuite_Linux_${{ github.ref_name }}.tar.gz RadarSuite_Linux/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: RadarSuite_Linux_V4.2/RadarSuite_Linux_${{ github.ref_name }}.tar.gz

  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows-release, build-linux-release]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-artifacts

      - name: List artifacts
        run: ls -la release-artifacts/

      - name: Generate release notes
        id: release_notes
        run: |
          cat << 'EOF' > release_notes.md
          # RadarSuite ${{ github.ref_name }}

          ## Downloads

          | Platform | File | Description |
          |----------|------|-------------|
          | Windows | `RadarSuite_Windows_${{ github.ref_name }}.zip` | Windows 10/11 (x64) |
          | Linux | `RadarSuite_Linux_${{ github.ref_name }}.tar.gz` | Linux (x64, PulseAudio/PipeWire) |

          ## What's New in V4.2

          - **Shot Detection** - Recognizes gunshot sounds
          - **ML Detection** - Machine learning for better classification
          - **Spectral Analysis** - Advanced FFT analysis
          - **Confidence Scoring** - Detection confidence system
          - **Improved Target Tracking** - Enhanced tracker
          - **5.1/7.1 Surround Support** - Auto channel detection
          - **PipeWire Native Support** (Linux) - Direct capture via pw-record

          ## Requirements

          ### Windows
          - Windows 10/11 (64-bit)
          - Audio output device (stereo or surround)

          ### Linux
          - Ubuntu 22.04+ / Debian 12+ / Fedora 38+ / Arch Linux
          - PulseAudio or PipeWire audio server
          - System dependencies (see README)

          ## Installation

          ### Windows
          1. Extract `RadarSuite_Windows_${{ github.ref_name }}.zip`
          2. Run `RadarSuite_Windows.exe`

          ### Linux
          1. Extract: `tar -xzf RadarSuite_Linux_${{ github.ref_name }}.tar.gz`
          2. Run: `./RadarSuite_Linux/RadarSuite_Linux`

          ---
          *Built automatically via GitHub Actions*
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: RadarSuite ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            release-artifacts/RadarSuite_Windows_${{ github.ref_name }}.zip
            release-artifacts/RadarSuite_Linux_${{ github.ref_name }}.tar.gz
